queries:
  - id: goblin-warrior
    text: "goblin warrior"
    tags: [tokens, creature, strict, ranking]
    intent: "Find explicit goblin warrior tokens before generic goblin or non-goblin warrior tokens."
    expectations:
      - scope: strict
        assert: findable
        target: goblin_warriors
        importance: 1.0
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: goblin_warriors
        worse: generic_goblins
        rule: majority
        importance: 0.9
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: goblin_warriors
        worse: orc_warriors
        rule: majority
        importance: 0.7

  - id: goblin-warrior-typo
    text: "goblin warror"
    tags: [tokens, creature, fuzzy, typo]
    intent: "A one-letter typo in warrior should still find goblin warrior tokens in fuzzy and combined search."
    expectations:
      - scope: fuzzy
        assert: findable
        target: goblin_warriors
        importance: 1.0
        gate: true
      - scope: combined
        assert: findable
        target: goblin_warriors
        importance: 1.0
        gate: true
      - scope: strict
        assert: not_findable
        target: goblin_warriors
        importance: 0.2

  - id: warrior-sword
    text: "warrior sword"
    tags: [tokens, creature, ranking]
    intent: "Sword-bearing warrior tokens should beat warrior tokens whose distinguishing weapon is not a sword."
    expectations:
      - scope: strict
        assert: findable
        target: human_warriors
        importance: 0.9
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: human_warriors
        worse: goblin_warriors
        rule: majority
        importance: 0.5

  - id: green-dragon
    text: "green dragon"
    tags: [tokens, creature, color, negative]
    intent: "Find green dragon assets while suppressing color-only matches on unrelated creatures."
    expectations:
      - scope: strict
        assert: findable
        target: green_dragons
        importance: 1.0
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: green_dragons
        worse: green_non_dragons
        rule: majority
        importance: 1.0
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: green_dragons
        worse: non_green_dragons
        rule: majority
        importance: 0.6

  - id: pseudo-dragon-spelling
    text: "pseudo dragon"
    tags: [tokens, creature, fuzzy, typo]
    intent: "Find pseudo dragon assets even when source filenames use the misspelling 'Psuedo'."
    expectations:
      - scope: fuzzy
        assert: findable
        target: pseudo_dragons
        importance: 1.0
        gate: true
      - scope: combined
        assert: findable
        target: pseudo_dragons
        importance: 1.0
        gate: true

  - id: adventurer
    text: "adventurer"
    tags: [tokens, domain, character]
    intent: "Domain search should understand adventurer as a broad character concept covering warriors, mages, and rogues."
    expectations:
      - scope: domain
        assert: findable
        target: adventurer_character_classes
        importance: 1.0
        gate: true
      - scope: combined
        assert: findable
        target: adventurer_character_classes
        importance: 0.9

  - id: tavern
    text: "tavern"
    tags: [music, maps, atmosphere]
    intent: "Tavern searches should surface tavern ambience/music and tavern visual signs before unrelated music."
    expectations:
      - scope: strict
        assert: findable
        target: tavern_music
        importance: 0.9
        gate: true
      - scope: combined
        assert: findable
        target: tavern_visuals
        importance: 0.6
      - scope: combined
        assert: group_ranks_above
        better: tavern_music
        worse: non_tavern_music
        rule: majority
        importance: 0.7

  - id: combat-music
    text: "combat music"
    tags: [music, ranking]
    intent: "Combat music searches should favor tracks in combat collections over tavern or wild atmosphere tracks."
    expectations:
      - scope: strict
        assert: findable
        target: combat_music
        importance: 0.9
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: combat_music
        worse: tavern_music
        rule: majority
        importance: 0.7

  - id: secret-door
    text: "secret door"
    tags: [mapmaking, prop, ranking]
    intent: "Secret door should prioritize the explicit secret door asset above generic doors and door sounds."
    expectations:
      - scope: strict
        assert: findable
        target:
          source_id: mapmaking
          relative_path: "animated_dungeon_megapack/secret_door.png"
        importance: 1.0
        gate: true
      - scope: combined
        assert: group_ranks_above
        better:
          source_id: mapmaking
          relative_path: "animated_dungeon_megapack/secret_door.png"
        worse: generic_dungeon_doors
        rule: majority
        importance: 0.7
      - scope: combined
        assert: group_ranks_above
        better: generic_dungeon_doors
        worse: generic_door_sounds
        rule: majority
        importance: 0.5

  - id: blood-splatter
    text: "blood splatter"
    tags: [mapmaking, prop, ranking]
    intent: "Blood splatter overlays should rank above broader blood-themed floor tiles or cave tiles."
    expectations:
      - scope: strict
        assert: findable
        target: blood_splatters
        importance: 1.0
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: blood_splatters
        worse: blood_tiles
        rule: majority
        importance: 0.8

  - id: log-bridge
    text: "log bridge"
    tags: [maps, mapmaking, prop, negative]
    intent: "A visual bridge query should find visual bridge assets before bridge sound effects."
    expectations:
      - scope: strict
        assert: findable
        target:
          source_id: maps
          relative_path: "ForgottenAdventures/Buildings___Structures/Bridges/Log_Bridge.png"
        importance: 1.0
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: visual_bridges
        worse: bridge_sounds
        rule: majority
        importance: 0.8

  - id: rain-thunder
    text: "rain thunder"
    tags: [sounds, ambience]
    intent: "Rain and thunder sound searches should surface matching weather ambience."
    expectations:
      - scope: strict
        assert: findable
        target: rain_thunder_sounds
        importance: 0.9
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: rain_thunder_sounds
        worse: generic_door_sounds
        rule: majority
        importance: 0.6

  - id: forest-ambience
    text: "forest ambience"
    tags: [sounds, music, ambience]
    intent: "Forest ambience searches should find forest sound beds before unrelated mechanical or door sounds."
    expectations:
      - scope: strict
        assert: findable
        target: forest_ambience_sounds
        importance: 0.9
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: forest_ambience_sounds
        worse: generic_door_sounds
        rule: majority
        importance: 0.7
