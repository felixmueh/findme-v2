queries:
  - id: goblin-exact-token
    text: "goblin"
    tags: [tokens, creature, strict, ranking]
    intent: "A simple exact creature query should prefer concise goblin token filenames over goblin-themed props."
    expectations:
      - scope: strict
        assert: group_ranks_above
        better: exact_goblin_tokens
        worse: goblin_themed_props
        rule: majority
        importance: 1.0
        gate: true

  - id: goblin-warrior
    text: "goblin warrior"
    tags: [tokens, creature, strict, ranking]
    intent: "Find explicit goblin warrior tokens before generic goblin or non-goblin warrior tokens."
    expectations:
      - scope: strict
        assert: findable
        target: goblin_warriors
        importance: 1.0
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: goblin_warriors
        worse: generic_goblins
        rule: majority
        importance: 0.9
        gate: true
      - scope: combined
        assert: group_ranks_above
        better: goblin_warriors
        worse: orc_warriors
        rule: majority
        importance: 0.7

  - id: goblin-warrior-typo
    text: "goblin warror"
    tags: [tokens, creature, fuzzy, typo]
    intent: "A one-letter typo in warrior should still find goblin warrior tokens in fuzzy and combined search."
    expectations:
      - scope: fuzzy
        assert: findable
        target: goblin_warriors
        importance: 1.0
        gate: true
      - scope: combined
        assert: findable
        target: goblin_warriors
        importance: 1.0
        gate: true
      - scope: strict
        assert: not_findable
        target: goblin_warriors
        importance: 0.2

