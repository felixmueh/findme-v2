[project]
name = "findme-v2"
version = "0.1.0"
description = "Personal asset finder"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.136",
  "Pillow>=12",
  "uvicorn>=0.38",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=9",
]

[project.scripts]
findme = "findme.cli:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.setuptools.packages.find]
where = ["backend"]
