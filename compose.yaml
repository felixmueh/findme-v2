services:
  findme:
    build:
      context: .
      dockerfile: Dockerfile
    image: findme-v2:server
    restart: unless-stopped
    ports:
      - "48317:8000"
    volumes:
      - /var/lib/findme-v2:/var/lib/findme-v2
      - /media/NAS/main/Documents/DND:/media/NAS/main/Documents/DND:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
