[app]
data_root = ".findme-data"
thumbnail_workers = 2
additional_thumbnail_mipmaps = [512, 1024]

[search]
domain_vocabulary = "search-vocabulary.yaml"

[[sources]]
id = "dnd"
display_name = "DND"
root = "sample-assets"
priority = 100
media_extensions = [".png", ".jpg", ".jpeg", ".webp", ".gif", ".webm", ".mp4"]
primary_output = "foundry"

[[sources.output_profiles]]
id = "foundry"
label = "Foundry"
prefix = "library/DND"
